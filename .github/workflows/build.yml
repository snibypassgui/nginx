name: Build nginx for Windows (MinGW)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  pcre2_ver: 10.48
  zlib_ver: 1.3.2
  openssl_ver: 3.5.8
  luajit_ver: v2.1-20260914
  ndk_ver: v0.3.4
  lua_nginx_ver: v0.10.32rc5
  lua_resty_core_ver: v0.1.35rc1
  lua_resty_lrucache_ver: v0.15
  lua_resty_dns_ver: v0.23
  lua_resty_http_ver: v0.18.0
  lua_resty_string_ver: v0.19
  headers_more_ver: v0.40

jobs:
  build:
    name: windows-2022, mingw-w64, x86_64
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            git
            curl
            tar

      - name: Check out nginx sources
        uses: actions/checkout@v7

      - name: Create build directory
        run: mkdir -p build/lib

      - name: Check out and prepare PCRE2 sources
        run: |
          curl -sLO https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${{ env.pcre2_ver }}/pcre2-${{ env.pcre2_ver }}.tar.gz
          tar -C build/lib -xzf pcre2-${{ env.pcre2_ver }}.tar.gz

      - name: Check out zlib sources
        run: |
          curl -sLO https://zlib.net/fossils/zlib-${{ env.zlib_ver }}.tar.gz || \
            curl -sLO https://github.com/madler/zlib/releases/download/v${{ env.zlib_ver }}/zlib-${{ env.zlib_ver }}.tar.gz
          tar -C build/lib -xzf zlib-${{ env.zlib_ver }}.tar.gz

      - name: Check out OpenSSL sources
        run: |
          curl -sLO https://github.com/openssl/openssl/releases/download/openssl-${{ env.openssl_ver }}/openssl-${{ env.openssl_ver }}.tar.gz
          tar -C build/lib -xzf openssl-${{ env.openssl_ver }}.tar.gz

      - name: Build LuaJIT
        run: |
          git clone --depth=1 --branch=${{ env.luajit_ver }} https://github.com/openresty/luajit2.git build/lib/luajit2
          cd build/lib/luajit2
          make -j$(nproc) BUILDMODE=static
          cd src
          ln -sf libluajit.a libluajit-5.1.a

      - name: Check out ngx_devel_kit sources
        run: git clone --depth=1 --branch=${{ env.ndk_ver }} https://github.com/vision5/ngx_devel_kit.git build/lib/ngx_devel_kit

      - name: Check out lua-nginx-module sources
        run: |
          git clone --depth=1 --branch=${{ env.lua_nginx_ver }} https://github.com/openresty/lua-nginx-module.git build/lib/lua-nginx-module
          cd build/lib/lua-nginx-module
          patch -p1 < ../../../patches/lua-nginx-module-mingw-static.patch

      - name: Check out lua-resty-core sources
        run: git clone --depth=1 --branch=${{ env.lua_resty_core_ver }} https://github.com/openresty/lua-resty-core.git build/lib/lua-resty-core

      - name: Check out lua-resty-lrucache sources
        run: git clone --depth=1 --branch=${{ env.lua_resty_lrucache_ver }} https://github.com/openresty/lua-resty-lrucache.git build/lib/lua-resty-lrucache

      - name: Check out lua-resty-dns sources
        run: git clone --depth=1 --branch=${{ env.lua_resty_dns_ver }} https://github.com/openresty/lua-resty-dns.git build/lib/lua-resty-dns

      - name: Check out lua-resty-http sources
        run: git clone --depth=1 --branch=${{ env.lua_resty_http_ver }} https://github.com/ledgetech/lua-resty-http.git build/lib/lua-resty-http

      - name: Check out lua-resty-string sources
        run: git clone --depth=1 --branch=${{ env.lua_resty_string_ver }} https://github.com/openresty/lua-resty-string.git build/lib/lua-resty-string

      - name: Check out headers-more-nginx-module sources
        run: git clone --depth=1 --branch=${{ env.headers_more_ver }} https://github.com/openresty/headers-more-nginx-module.git build/lib/headers-more-nginx-module

      - name: Build Windows resource file
        run: |
          mkdir -p objs
          windres -i src/os/win32/nginx.rc -o objs/nginx_resource.o

      - name: Configure and build nginx
        run: |
          export LUAJIT_LIB=$(pwd)/build/lib/luajit2/src
          export LUAJIT_INC=$(pwd)/build/lib/luajit2/src

          ./auto/configure \
            --prefix= \
            --conf-path=conf/nginx.conf \
            --pid-path=logs/nginx.pid \
            --http-log-path=logs/access.log \
            --error-log-path=logs/error.log \
            --sbin-path=nginx.exe \
            --http-client-body-temp-path=temp/client_body_temp \
            --http-proxy-temp-path=temp/proxy_temp \
            --http-fastcgi-temp-path=temp/fastcgi_temp \
            --http-uwsgi-temp-path=temp/uwsgi_temp \
            --http-scgi-temp-path=temp/scgi_temp \
            --with-cc-opt="-O2 -DFD_SETSIZE=1024 -Ibuild/lib/luajit2/src -Wno-cast-function-type -Wno-unused-function -Wno-sign-compare" \
            --with-ld-opt="-Lbuild/lib/luajit2/src -static-libgcc objs/nginx_resource.o" \
            --with-pcre=build/lib/pcre2-${{ env.pcre2_ver }} \
            --with-zlib=build/lib/zlib-${{ env.zlib_ver }} \
            --with-openssl=build/lib/openssl-${{ env.openssl_ver }} \
            --with-http_ssl_module \
            --with-http_v2_module \
            --with-http_realip_module \
            --with-http_addition_module \
            --with-http_sub_module \
            --with-http_dav_module \
            --with-http_stub_status_module \
            --with-http_flv_module \
            --with-http_mp4_module \
            --with-http_gunzip_module \
            --with-http_gzip_static_module \
            --with-http_auth_request_module \
            --with-http_random_index_module \
            --with-http_secure_link_module \
            --with-http_slice_module \
            --with-mail \
            --with-mail_ssl_module \
            --with-stream \
            --with-stream_ssl_module \
            --with-stream_realip_module \
            --with-stream_ssl_preread_module \
            --add-module=build/lib/ngx_devel_kit \
            --add-module=build/lib/lua-nginx-module \
            --add-module=build/lib/headers-more-nginx-module

          make -j$(nproc)

      - name: Package nginx
        run: |
          mkdir -p build/nginx-package
          cp objs/nginx.exe build/nginx-package/nginx.exe

          mkdir -p build/nginx-package/lua/resty build/nginx-package/lua/ngx
          cp -r build/lib/lua-resty-core/lib/resty/* build/nginx-package/lua/resty/
          cp -r build/lib/lua-resty-core/lib/ngx/* build/nginx-package/lua/ngx/
          cp -r build/lib/lua-resty-lrucache/lib/resty/* build/nginx-package/lua/resty/
          cp -r build/lib/lua-resty-dns/lib/resty/* build/nginx-package/lua/resty/
          cp -r build/lib/lua-resty-http/lib/resty/* build/nginx-package/lua/resty/
          cp -r build/lib/lua-resty-string/lib/resty/* build/nginx-package/lua/resty/

      - name: Show nginx configuration
        run: build/nginx-package/nginx.exe -V

      - name: Upload nginx binary
        uses: actions/upload-artifact@v7
        with:
          name: nginx-windows-mingw-x86_64-lua
          path: build/nginx-package/
          if-no-files-found: error
